// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath 'net.saliman:gradle-properties-plugin:1.5.2' // Updated version compatible with newer Gradle
    }
}

plugins {
    id 'net.saliman.properties' version '1.5.2' apply false
}

allprojects {
    apply plugin: 'net.saliman.properties'
    repositories {
        google()
        mavenCentral()
    }
}
