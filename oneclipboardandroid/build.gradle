plugins {
    id 'com.android.application'
}

android {
    namespace "com.cb.oneclipboard"
    compileSdk 34

    defaultConfig {
        applicationId "com.cb.oneclipboard"
        minSdk 24
        targetSdk 34
        versionCode 120
        versionName "1.2.0"

        // Resource values will be populated from gradle.properties or command line
        resValue("string", "serverHostName", project.findProperty("serverHostName") ?: "localhost")
        resValue("integer", "serverPort", project.findProperty("serverPort") ?: "4545")
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':oneclipboardlib')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}
