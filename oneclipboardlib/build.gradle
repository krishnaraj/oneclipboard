plugins {
    id 'java'
    id 'eclipse'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

version = '1.0'

sourceSets.main.java.srcDirs = ['src']

dependencies {
    implementation 'org.jasypt:jasypt:1.9.2'
}
